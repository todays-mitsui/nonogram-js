name: Origin trial expiry

# WebMCP のオリジントライアルのトークンが期限の 30 日前を切ったら Issue を立てる
on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - id: check
        run: node scripts/check-origin-trial.js
      - if: steps.check.outputs.expiring == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ steps.check.outputs.summary }}
        run: |
          title='オリジントライアルのトークンの期限が近い'
          if [ -z "$(gh issue list --state open --search "in:title $title" --json number --jq '.[].number')" ]; then
            gh issue create --title "$title" --body "$(printf '%s\n\n%s\n' "$SUMMARY" 'トークンを更新して index.html の <meta http-equiv="origin-trial"> を差し替える。WebMCP が正式に出荷されていればトークンを外す。')"
          fi
